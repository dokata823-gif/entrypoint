<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모바일 주식 차트 - TradingView 드로잉 직선 기능</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- TradingView Official Widget Script -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            950: '#070a0f',
                            900: '#131722',
                            800: '#1e222d',
                            700: '#2a2e39'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #131722;
            color: #d1d4dc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .font-mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
    </style>
</head>
<body class="bg-[#131722] text-[#d1d4dc]">

    <!-- 1. Top Ticker Search Bar -->
    <header class="px-3 py-2 bg-[#1e222d] border-b border-[#2a2e39] flex items-center gap-2 shrink-0">
        <div class="relative flex-1">
            <input 
                id="tickerInput" 
                type="text" 
                value="MU" 
                placeholder="티커 입력 (예: MU, NVDA, AAPL, 005930)" 
                autocomplete="off"
                autocapitalize="characters"
                class="w-full h-10 bg-[#2a2e39] border border-[#363a45] rounded-lg text-white font-bold text-sm px-3 uppercase outline-none focus:border-[#2962ff] transition"
            />
        </div>
        <button 
            onclick="loadChart()" 
            class="h-10 px-4 bg-[#2962ff] hover:bg-[#1e4bd8] active:bg-[#1b43c6] text-white font-bold rounded-lg text-sm transition shrink-0 flex items-center gap-1"
        >
            <span>조회</span>
        </button>
    </header>

    <!-- 2. Peak & 0.7 Level Info Bar (고점 및 0.7 타점 바) -->
    <section class="bg-[#181c27] border-b border-[#2a2e39] px-3 py-1.5 shrink-0 flex items-center justify-between gap-2 text-xs">
        
        <!-- Peak Input (고점 입력) -->
        <div class="flex items-center gap-1.5">
            <span class="text-amber-400 font-bold flex items-center gap-1 text-[11px]">
                <i data-lucide="crown" class="w-3.5 h-3.5"></i> 고점:
            </span>
            <input 
                id="peakPriceInput" 
                type="number" 
                step="any" 
                value="1255" 
                class="w-24 h-8 bg-[#2a2e39] text-amber-300 font-mono font-black text-sm px-2 rounded border border-[#363a45] focus:border-amber-400 outline-none text-right"
                oninput="recalculateTargets()"
            />
        </div>

        <!-- 0.7 Target Output (고점 * 0.7 타점) -->
        <div class="flex items-center gap-1.5 bg-[#131722] px-2.5 py-1 rounded-lg border border-emerald-500/30">
            <span class="text-emerald-400 font-bold text-[11px]">고점 × 0.7:</span>
            <span id="target07Display" class="font-mono font-black text-sm text-emerald-300">$878.50</span>
            <span class="text-[10px] text-emerald-500 font-bold">(-30%)</span>
        </div>

        <!-- Drawing Tool Guide Toggle -->
        <button 
            onclick="toggleDrawGuide()" 
            class="h-8 px-2 bg-[#2a2e39] hover:bg-[#363a45] text-amber-300 text-xs rounded font-bold border border-amber-500/40 flex items-center gap-1 transition"
        >
            <i data-lucide="pen-tool" class="w-3.5 h-3.5"></i>
            <span>직선 툴</span>
        </button>
    </section>

    <!-- 3. Drawing Guide Banner (Collapsible) -->
    <div id="drawGuideBanner" class="bg-[#1c2333] border-b border-[#2a2e39] px-3 py-2 text-xs text-slate-200 shrink-0 flex items-center justify-between gap-2">
        <div class="flex items-center gap-2">
            <i data-lucide="info" class="w-4 h-4 text-amber-400 shrink-0"></i>
            <span>차트 좌측 툴바의 <strong>선 도구(2번째 아이콘) → 수평선(Horizontal Line)</strong>을 선택 후 원하는 가격대를 터치하면 직선이 그어집니다.</span>
        </div>
        <button onclick="toggleDrawGuide()" class="text-slate-400 hover:text-white p-1">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
    </div>

    <!-- 4. Original TradingView Chart with Full Drawing Tools Enabled -->
    <main class="flex-1 w-full relative">
        <div id="tv_chart_container" class="w-full h-full"></div>
    </main>

    <script>
        lucide.createIcons();

        const DEFAULT_PEAKS = {
            'MU': 1255,
            'NVDA': 140.76,
            'AAPL': 237.23,
            'TSLA': 271.00,
            '005930': 88800,
            '000660': 248500,
            'BTC': 73750
        };

        function normalizeTicker(ticker) {
            ticker = ticker.trim().toUpperCase();
            if (!ticker) return 'MU';
            if (/^\d{6}$/.test(ticker)) {
                return 'KRX:' + ticker;
            }
            return ticker;
        }

        function formatVal(val, isKRW) {
            if (isKRW) {
                return `₩${Math.round(val).toLocaleString()}`;
            }
            return `$${val.toFixed(2)}`;
        }

        function recalculateTargets() {
            const peakInput = document.getElementById('peakPriceInput');
            const peak = parseFloat(peakInput.value) || 0;
            const ticker = document.getElementById('tickerInput').value.trim();
            const isKRW = /^\d{6}$/.test(ticker) || ticker.startsWith('KRX:');

            const target07 = peak * 0.70;
            document.getElementById('target07Display').textContent = formatVal(target07, isKRW);
        }

        function toggleDrawGuide() {
            const banner = document.getElementById('drawGuideBanner');
            banner.classList.toggle('hidden');
        }

        // Load TradingView Chart with Full Side Drawing Toolbar (직선/수평선 작도 툴 활성화)
        function loadChart() {
            const input = document.getElementById('tickerInput');
            const rawTicker = input.value.trim();
            const symbol = normalizeTicker(rawTicker);
            input.blur();

            const cleanKey = rawTicker.toUpperCase().replace('KRX:', '');
            if (DEFAULT_PEAKS[cleanKey]) {
                document.getElementById('peakPriceInput').value = DEFAULT_PEAKS[cleanKey];
            }
            recalculateTargets();

            const container = document.getElementById('tv_chart_container');
            container.innerHTML = '';

            const widgetDiv = document.createElement('div');
            widgetDiv.id = 'tradingview_widget';
            widgetDiv.style.width = '100%';
            widgetDiv.style.height = '100%';
            container.appendChild(widgetDiv);

            if (typeof TradingView !== 'undefined') {
                new TradingView.widget({
                    "autosize": true,
                    "symbol": symbol,
                    "interval": "D",
                    "timezone": "Asia/Seoul",
                    "theme": "dark",
                    "style": "1",
                    "locale": "kr",
                    "toolbar_bg": "#1e222d",
                    "enable_publishing": false,
                    "allow_symbol_change": true,
                    "hide_side_toolbar": false,     // ★ 좌측 드로잉/직선 툴바 활성화 ★
                    "withdateranges": true,
                    "container_id": "tradingview_widget",
                    "studies": [
                        "MASimple@tv-basicstudies",
                        "Volume@tv-basicstudies"
                    ]
                });
            }
        }

        document.getElementById('tickerInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') loadChart();
        });

        document.getElementById('peakPriceInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                recalculateTargets();
                this.blur();
            }
        });

        window.addEventListener('DOMContentLoaded', function() {
            loadChart();
        });
    </script>
</body>
</html>
