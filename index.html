<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모바일 주식 차트</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- TradingView Lightweight Charts v4 CDN -->
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #131722;
            color: #d1d4dc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            touch-action: pan-y;
        }
        .font-mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
    </style>
</head>
<body class="bg-[#131722] text-[#d1d4dc]">

    <!-- 1. Top Ticker Search Bar -->
    <header class="px-3 py-2 bg-[#1e222d] border-b border-[#2a2e39] flex items-center gap-2 shrink-0">
        <div class="relative flex-1">
            <input 
                id="tickerInput" 
                type="text" 
                value="MU" 
                placeholder="티커 입력 (예: MU, NVDA, AAPL, 005930)" 
                autocomplete="off"
                autocapitalize="characters"
                class="w-full h-10 bg-[#2a2e39] border border-[#363a45] rounded-lg text-white font-bold text-sm px-3 uppercase outline-none focus:border-[#2962ff] transition"
            />
        </div>
        <button 
            onclick="handleSearch()" 
            class="h-10 px-4 bg-[#2962ff] hover:bg-[#1e4bd8] active:bg-[#1b43c6] text-white font-bold rounded-lg text-sm transition shrink-0"
        >
            조회
        </button>
    </header>

    <!-- 2. Top Info Bar: Visible Peak & Peak * 0.7 (상단 정보 표시 바) -->
    <section class="bg-[#181c27] border-b border-[#2a2e39] px-3 py-2 shrink-0 flex items-center justify-between gap-2 text-xs">
        
        <!-- Live Visible Peak Indicator -->
        <div class="flex items-center gap-1.5 bg-[#131722] px-2.5 py-1.5 rounded-lg border border-amber-500/30">
            <span class="text-amber-400 font-bold flex items-center gap-1 text-[11px]">
                <i data-lucide="crown" class="w-3.5 h-3.5"></i> 고점:
            </span>
            <span id="peakDisplay" class="font-mono font-black text-sm text-amber-300">$0.00</span>
        </div>

        <!-- Live 0.7 Level Indicator (-30%) -->
        <div class="flex items-center gap-1.5 bg-[#131722] px-2.5 py-1.5 rounded-lg border border-emerald-500/30">
            <span class="text-emerald-400 font-bold text-[11px]">고점 × 0.7:</span>
            <span id="target07Display" class="font-mono font-black text-sm text-emerald-300">$0.00</span>
            <span class="text-[10px] text-emerald-400 font-mono font-bold">(-30%)</span>
        </div>

        <!-- Quick Reset/Fit Button -->
        <button 
            onclick="fitChartView()" 
            class="h-8 px-2 bg-[#2a2e39] hover:bg-[#363a45] text-slate-300 text-xs rounded font-bold border border-slate-700 flex items-center gap-1 transition shrink-0"
            title="차트 전체 맞춤"
        >
            <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i>
            <span>맞춤</span>
        </button>
    </section>

    <!-- 3. Clean Fullscreen Chart Container (No on-chart drawing lines) -->
    <main class="flex-1 w-full relative bg-[#131722]">
        <div id="chartContainer" class="w-full h-full"></div>
    </main>

    <script>
        lucide.createIcons();

        // Baseline Data Profiles for popular tickers
        const TICKER_CONFIGS = {
            'MU': { high: 1255.00, low: 450.00, currency: '$', isKRW: false },
            'NVDA': { high: 240.00, low: 155.00, currency: '$', isKRW: false },
            'AAPL': { high: 237.23, low: 165.00, currency: '$', isKRW: false },
            'TSLA': { high: 271.00, low: 138.00, currency: '$', isKRW: false },
            'PLTR': { high: 44.20, low: 16.00, currency: '$', isKRW: false },
            '005930': { high: 88800, low: 58000, currency: '₩', isKRW: true },
            '000660': { high: 248500, low: 115000, currency: '₩', isKRW: true },
            'BTC': { high: 73750, low: 38000, currency: '$', isKRW: false }
        };

        let chart = null;
        let candleSeries = null;
        let currentCandles = [];
        let currentCurrency = '$';
        let currentIsKRW = false;
        let isUpdating = false;

        function formatPrice(val) {
            if (currentIsKRW) {
                return `₩${Math.round(val).toLocaleString()}`;
            }
            return `$${val.toFixed(2)}`;
        }

        // Generate candlestick data with natural price waves
        function generateStockData(ticker) {
            ticker = ticker.toUpperCase().replace('KRX:', '');
            const isKRW = /^\d{6}$/.test(ticker);
            const conf = TICKER_CONFIGS[ticker] || {
                high: isKRW ? 120000 : 250.00,
                low: isKRW ? 60000 : 120.00,
                currency: isKRW ? '₩' : '$',
                isKRW: isKRW
            };

            currentCurrency = conf.currency;
            currentIsKRW = conf.isKRW;

            const maxPrice = conf.high;
            const minPrice = conf.low;
            const candles = [];
            const totalBars = 260;
            const now = new Date();
            let date = new Date(now.getTime() - totalBars * 24 * 60 * 60 * 1000);

            let seed = 0;
            for (let i = 0; i < ticker.length; i++) seed += ticker.charCodeAt(i);
            function rand() {
                const x = Math.sin(seed++) * 10000;
                return x - Math.floor(x);
            }

            let price = minPrice + (maxPrice - minPrice) * 0.35;
            const mainPeakBar = 180;

            for (let i = 0; i < totalBars; i++) {
                if (date.getDay() === 0) date.setDate(date.getDate() + 1);
                if (date.getDay() === 6) date.setDate(date.getDate() + 2);

                const dateStr = date.toISOString().split('T')[0];
                let target;
                if (i < 90) {
                    target = minPrice + (maxPrice - minPrice) * 0.60;
                } else if (i < mainPeakBar) {
                    target = maxPrice;
                } else {
                    target = minPrice + (maxPrice - minPrice) * 0.45;
                }

                const drift = (target - price) * 0.03 + (Math.sin(i * 0.12) * (maxPrice - minPrice) * 0.02);
                const noise = (rand() - 0.48) * ((maxPrice - minPrice) * 0.035);

                const open = price;
                let close = open + drift + noise;
                if (i === mainPeakBar) close = maxPrice * 0.99;

                let high = Math.max(open, close) + Math.abs(rand() * (maxPrice - minPrice) * 0.015);
                let low = Math.min(open, close) - Math.abs(rand() * (maxPrice - minPrice) * 0.015);

                if (i === mainPeakBar) high = maxPrice;
                if (high >= maxPrice && i !== mainPeakBar) high = maxPrice * 0.985;

                const roundFn = (v) => currentIsKRW ? Math.round(v) : parseFloat(v.toFixed(2));
                candles.push({
                    time: dateStr,
                    open: roundFn(open),
                    high: roundFn(high),
                    low: roundFn(low),
                    close: roundFn(close)
                });

                price = close;
                date.setDate(date.getDate() + 1);
            }

            return candles;
        }

        // Initialize Clean Chart (No on-chart drawing lines)
        function initChart() {
            const container = document.getElementById('chartContainer');
            container.innerHTML = '';

            chart = LightweightCharts.createChart(container, {
                width: container.clientWidth,
                height: container.clientHeight,
                layout: {
                    background: { color: '#131722' },
                    textColor: '#94a3b8',
                    fontSize: 10,
                },
                grid: {
                    vertLines: { color: '#1e222d' },
                    horzLines: { color: '#1e222d' },
                },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                },
                rightPriceScale: {
                    borderColor: '#2a2e39',
                    scaleMargins: { top: 0.1, bottom: 0.1 },
                    autoScale: true,
                },
                timeScale: {
                    borderColor: '#2a2e39',
                    fixLeftEdge: true,
                    fixRightEdge: true,
                    barSpacing: 6,
                },
                handleScroll: {
                    mouseWheel: true,
                    pressedMouseMove: true,
                    horzTouchDrag: true,
                    vertTouchDrag: false
                },
                handleScale: {
                    axisPressedMouseMove: true,
                    pinch: true,
                }
            });

            candleSeries = chart.addCandlestickSeries({
                upColor: '#089981',
                downColor: '#f23645',
                borderUpColor: '#089981',
                borderDownColor: '#f23645',
                wickUpColor: '#089981',
                wickDownColor: '#f23645',
            });

            // Real-Time Event: Whenever visible range changes (Zoom, Pan, Scroll)
            chart.timeScale().subscribeVisibleLogicalRangeChange(range => {
                if (!range || !currentCandles.length) return;
                if (!isUpdating) {
                    isUpdating = true;
                    requestAnimationFrame(() => {
                        updateVisiblePeak(range);
                        isUpdating = false;
                    });
                }
            });

            // Resize Observer
            window.addEventListener('resize', () => {
                if (chart && container) {
                    chart.applyOptions({
                        width: container.clientWidth,
                        height: container.clientHeight
                    });
                }
            });
        }

        // Real-Time Calculation: Extract visible candles and update top display values only
        function updateVisiblePeak(logicalRange) {
            if (!currentCandles.length) return;

            const fromIdx = Math.max(0, Math.floor(logicalRange.from));
            const toIdx = Math.min(currentCandles.length - 1, Math.ceil(logicalRange.to));

            if (fromIdx > toIdx) return;

            // Find highest high in visible range
            let visiblePeak = -Infinity;
            for (let i = fromIdx; i <= toIdx; i++) {
                const c = currentCandles[i];
                if (c && c.high > visiblePeak) {
                    visiblePeak = c.high;
                }
            }

            if (visiblePeak === -Infinity || visiblePeak <= 0) return;

            const target07 = visiblePeak * 0.70;

            // Update Top Header Display ONLY (No lines drawn on chart)
            document.getElementById('peakDisplay').textContent = formatPrice(visiblePeak);
            document.getElementById('target07Display').textContent = formatPrice(target07);
        }

        // Load Ticker Data
        function loadTicker(ticker) {
            ticker = ticker.trim().toUpperCase() || 'MU';

            currentCandles = generateStockData(ticker);
            candleSeries.setData(currentCandles);

            const total = currentCandles.length;
            chart.timeScale().setVisibleLogicalRange({
                from: Math.max(0, total - 90),
                to: total - 1
            });
        }

        function handleSearch() {
            const input = document.getElementById('tickerInput');
            loadTicker(input.value);
            input.blur();
        }

        function fitChartView() {
            if (chart) chart.timeScale().fitContent();
        }

        // Enter Key Listener
        document.getElementById('tickerInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            initChart();
            loadTicker('MU');
        });
    </script>
</body>
</html>
