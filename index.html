<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모바일 주식 차트</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- TradingView Official Widget Script -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            950: '#070a0f',
                            900: '#131722',
                            800: '#1e222d',
                            700: '#2a2e39'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #131722;
            color: #d1d4dc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .font-mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
    </style>
</head>
<body class="bg-[#131722] text-[#d1d4dc]">

    <!-- 1. Top Ticker Search Bar -->
    <header class="px-3 py-2 bg-[#1e222d] border-b border-[#2a2e39] flex items-center gap-2 shrink-0">
        <div class="relative flex-1">
            <input 
                id="tickerInput" 
                type="text" 
                value="MU" 
                placeholder="티커 입력 (예: MU, NVDA, AAPL, 005930)" 
                autocomplete="off"
                autocapitalize="characters"
                class="w-full h-10 bg-[#2a2e39] border border-[#363a45] rounded-lg text-white font-bold text-sm px-3 uppercase outline-none focus:border-[#2962ff] transition"
            />
        </div>
        <button 
            onclick="loadChart()" 
            class="h-10 px-4 bg-[#2962ff] hover:bg-[#1e4bd8] active:bg-[#1b43c6] text-white font-bold rounded-lg text-sm transition shrink-0"
        >
            조회
        </button>
    </header>

    <!-- 2. Peak & 0.7 Level Info Bar (고점 및 고점 * 0.7 계산 패널) -->
    <section class="bg-[#181c27] border-b border-[#2a2e39] px-3 py-1.5 shrink-0 flex items-center justify-between gap-2 text-xs">
        
        <!-- Peak Input (고점 직접 입력 및 확인) -->
        <div class="flex items-center gap-1.5">
            <span class="text-amber-400 font-bold flex items-center gap-1 text-[11px]">
                <i data-lucide="crown" class="w-3.5 h-3.5"></i> 고점:
            </span>
            <input 
                id="peakPriceInput" 
                type="number" 
                step="any" 
                value="1255" 
                class="w-24 h-8 bg-[#2a2e39] text-amber-300 font-mono font-black text-sm px-2 rounded border border-[#363a45] focus:border-amber-400 outline-none text-right"
                oninput="recalculateTargets()"
            />
        </div>

        <!-- 0.7 Target Output (고점 * 0.7 = -30% 타점) -->
        <div class="flex items-center gap-1.5 bg-[#131722] px-2.5 py-1 rounded-lg border border-emerald-500/30">
            <span class="text-emerald-400 font-bold text-[11px]">고점 × 0.7:</span>
            <span id="target07Display" class="font-mono font-black text-sm text-emerald-300">$878.50</span>
            <span class="text-[10px] text-emerald-500 font-bold">(-30%)</span>
        </div>

        <!-- Full Matrix Toggle Button -->
        <button 
            onclick="toggleDetailsModal()" 
            class="h-8 px-2 bg-[#2a2e39] hover:bg-[#363a45] text-blue-400 text-xs rounded font-bold border border-slate-700 flex items-center gap-1 transition"
        >
            <i data-lucide="layers" class="w-3.5 h-3.5"></i>
            <span>타점표</span>
        </button>
    </section>

    <!-- 3. Multi-Level Drop Grid Dropdown (Collapsible) -->
    <div id="detailsDrawer" class="hidden bg-[#181c27] border-b border-[#2a2e39] px-3 py-2 shrink-0 z-40">
        <div class="grid grid-cols-5 gap-1.5 text-center text-xs font-mono">
            <div class="bg-[#131722] p-1 rounded border border-blue-900/40">
                <span class="text-[9px] text-blue-400 font-bold block">× 0.70 (-30%)</span>
                <span id="lv30" class="text-xs font-bold text-white mt-0.5 block">$878.50</span>
            </div>
            <div class="bg-[#131722] p-1 rounded border border-cyan-900/40">
                <span class="text-[9px] text-cyan-400 font-bold block">× 0.65 (-35%)</span>
                <span id="lv35" class="text-xs font-bold text-white mt-0.5 block">$815.75</span>
            </div>
            <div class="bg-[#131722] p-1 rounded border border-emerald-900/40">
                <span class="text-[9px] text-emerald-400 font-bold block">× 0.60 (-40%)</span>
                <span id="lv40" class="text-xs font-bold text-white mt-0.5 block">$753.00</span>
            </div>
            <div class="bg-[#131722] p-1 rounded border border-orange-900/40">
                <span class="text-[9px] text-orange-400 font-bold block">× 0.55 (-45%)</span>
                <span id="lv45" class="text-xs font-bold text-white mt-0.5 block">$690.25</span>
            </div>
            <div class="bg-[#131722] p-1 rounded border border-rose-900/40">
                <span class="text-[9px] text-rose-400 font-bold block">× 0.50 (-50%)</span>
                <span id="lv50" class="text-xs font-bold text-white mt-0.5 block">$627.50</span>
            </div>
        </div>
    </div>

    <!-- 4. Original TradingView Real-Time Chart (Clean & Fullscreen) -->
    <main class="flex-1 w-full relative">
        <div id="tv_chart_container" class="w-full h-full"></div>
    </main>

    <script>
        lucide.createIcons();

        // Preset stock peak references
        const DEFAULT_PEAKS = {
            'MU': 1255,      // 2026-06-26 peak: 1255.00
            'NVDA': 140.76,
            'AAPL': 237.23,
            'TSLA': 271.00,
            '005930': 88800,
            '000660': 248500,
            'BTC': 73750
        };

        function normalizeTicker(ticker) {
            ticker = ticker.trim().toUpperCase();
            if (!ticker) return 'MU';
            if (/^\d{6}$/.test(ticker)) {
                return 'KRX:' + ticker;
            }
            return ticker;
        }

        function formatVal(val, isKRW) {
            if (isKRW) {
                return `₩${Math.round(val).toLocaleString()}`;
            }
            return `$${val.toFixed(2)}`;
        }

        // Recalculate 0.7 and other pullback levels based on Peak Price
        function recalculateTargets() {
            const peakInput = document.getElementById('peakPriceInput');
            const peak = parseFloat(peakInput.value) || 0;
            const ticker = document.getElementById('tickerInput').value.trim();
            const isKRW = /^\d{6}$/.test(ticker) || ticker.startsWith('KRX:');

            const target07 = peak * 0.70;
            const target065 = peak * 0.65;
            const target060 = peak * 0.60;
            const target055 = peak * 0.55;
            const target050 = peak * 0.50;

            document.getElementById('target07Display').textContent = formatVal(target07, isKRW);
            document.getElementById('lv30').textContent = formatVal(target07, isKRW);
            document.getElementById('lv35').textContent = formatVal(target065, isKRW);
            document.getElementById('lv40').textContent = formatVal(target060, isKRW);
            document.getElementById('lv45').textContent = formatVal(target055, isKRW);
            document.getElementById('lv50').textContent = formatVal(target050, isKRW);
        }

        function toggleDetailsModal() {
            const drawer = document.getElementById('detailsDrawer');
            drawer.classList.toggle('hidden');
        }

        // Load Original TradingView Real-Time Chart
        function loadChart() {
            const input = document.getElementById('tickerInput');
            const rawTicker = input.value.trim();
            const symbol = normalizeTicker(rawTicker);
            input.blur(); // 모바일 키보드 닫기

            // Update default peak if known
            const cleanKey = rawTicker.toUpperCase().replace('KRX:', '');
            if (DEFAULT_PEAKS[cleanKey]) {
                document.getElementById('peakPriceInput').value = DEFAULT_PEAKS[cleanKey];
            }
            recalculateTargets();

            const container = document.getElementById('tv_chart_container');
            container.innerHTML = '';

            const widgetDiv = document.createElement('div');
            widgetDiv.id = 'tradingview_widget';
            widgetDiv.style.width = '100%';
            widgetDiv.style.height = '100%';
            container.appendChild(widgetDiv);

            if (typeof TradingView !== 'undefined') {
                new TradingView.widget({
                    "autosize": true,
                    "symbol": symbol,
                    "interval": "D",
                    "timezone": "Asia/Seoul",
                    "theme": "dark",
                    "style": "1",
                    "locale": "kr",
                    "toolbar_bg": "#1e222d",
                    "enable_publishing": false,
                    "allow_symbol_change": true,
                    "container_id": "tradingview_widget",
                    "studies": [
                        "MASimple@tv-basicstudies",
                        "Volume@tv-basicstudies"
                    ]
                });
            }
        }

        // Enter Key Listener
        document.getElementById('tickerInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                loadChart();
            }
        });

        document.getElementById('peakPriceInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                recalculateTargets();
                this.blur();
            }
        });

        // Initial Load
        window.addEventListener('DOMContentLoaded', function() {
            loadChart();
        });
    </script>
</body>
</html>
