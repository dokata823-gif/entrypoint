<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모바일 주식 차트 - 최고점 수평선 표시</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- TradingView Lightweight Charts CDN -->
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            950: '#070a0f',
                            900: '#0d131f',
                            800: '#151d2e',
                            700: '#222f46'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap');
        
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #070a0f;
            color: #e2e8f0;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body class="h-[100dvh] flex flex-col bg-[#070a0f] text-slate-100 antialiased overflow-hidden">

    <!-- Top Sticky Search & Status Bar -->
    <header class="bg-[#0d131f] border-b border-slate-800 px-3 py-2 shrink-0 z-50">
        <div class="max-w-2xl mx-auto space-y-2">
            
            <!-- Ticker Input Row -->
            <form id="tickerForm" class="flex items-center gap-2" onsubmit="event.preventDefault(); applyTicker();">
                <div class="relative flex-1">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="search" class="w-4 h-4 text-blue-400"></i>
                    </div>
                    <input 
                        id="tickerInput" 
                        type="text" 
                        value="MU" 
                        placeholder="티커 입력 (예: MU, NVDA, AAPL, 005930)" 
                        autocomplete="off"
                        autocapitalize="characters"
                        spellcheck="false"
                        class="w-full h-11 bg-slate-800/90 text-white font-mono font-bold text-sm rounded-xl pl-9 pr-8 border border-slate-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 focus:outline-none transition uppercase"
                    />
                    <button 
                        type="button" 
                        id="clearBtn" 
                        class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-white"
                        onclick="clearInput()"
                    >
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>

                <button 
                    type="submit" 
                    class="h-11 px-4 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-bold text-sm rounded-xl flex items-center justify-center gap-1.5 shadow-lg shadow-blue-600/25 transition shrink-0"
                >
                    <span>조회</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>

            <!-- Quick Ticker Select Chips -->
            <div class="flex items-center gap-1.5 overflow-x-auto pb-0.5 text-xs no-scrollbar">
                <span class="text-[10px] text-slate-400 font-semibold shrink-0 mr-0.5">인기:</span>
                <button onclick="setTicker('MU')" class="px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-emerald-400 border border-slate-700 font-mono font-bold shrink-0 transition">MU</button>
                <button onclick="setTicker('NVDA')" class="px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700 font-mono font-semibold shrink-0 transition">NVDA</button>
                <button onclick="setTicker('AAPL')" class="px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700 font-mono font-semibold shrink-0 transition">AAPL</button>
                <button onclick="setTicker('TSLA')" class="px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700 font-mono font-semibold shrink-0 transition">TSLA</button>
                <button onclick="setTicker('GOOGL')" class="px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700 font-mono font-semibold shrink-0 transition">GOOGL</button>
                <button onclick="setTicker('PLTR')" class="px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700 font-mono font-semibold shrink-0 transition">PLTR</button>
                <button onclick="setTicker('005930')" class="px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-amber-400 border border-slate-700 font-mono font-semibold shrink-0 transition">삼성전자</button>
                <button onclick="setTicker('000660')" class="px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-amber-400 border border-slate-700 font-mono font-semibold shrink-0 transition">SK하이닉스</button>
            </div>

        </div>
    </header>

    <!-- Main Fullscreen Chart Area with Highest Price Overlay -->
    <main class="flex-1 w-full relative bg-[#070a0f]">
        
        <!-- Interactive Chart Container -->
        <div id="chartContainer" class="w-full h-full"></div>

        <!-- Floating Highest Price & Current Price Banner -->
        <div class="absolute top-3 left-3 z-10 bg-slate-900/90 backdrop-blur-md border border-slate-700/80 rounded-xl p-2.5 shadow-2xl flex items-center gap-3">
            <div>
                <span class="text-[9px] text-amber-400 font-bold block flex items-center gap-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span> 최고점 (ATH)
                </span>
                <span id="peakPriceText" class="text-sm font-black font-mono text-amber-300">$157.50</span>
            </div>
            <div class="w-[1px] h-6 bg-slate-700"></div>
            <div>
                <span class="text-[9px] text-slate-400 font-medium block">최근가</span>
                <span id="currentPriceText" class="text-sm font-bold font-mono text-white">$108.40</span>
            </div>
            <div class="w-[1px] h-6 bg-slate-700"></div>
            <div>
                <span class="text-[9px] text-slate-400 font-medium block">최고가 대비</span>
                <span id="dropRateText" class="text-xs font-bold font-mono text-rose-400">-31.17%</span>
            </div>
        </div>

        <!-- Quick Reset View Button -->
        <button 
            id="fitViewBtn" 
            onclick="fitChart()"
            class="absolute bottom-4 right-4 z-10 bg-slate-800/90 hover:bg-slate-700 active:bg-slate-600 text-slate-200 text-xs px-3 py-1.5 rounded-lg border border-slate-700 shadow-lg flex items-center gap-1 font-semibold"
        >
            <i data-lucide="maximize-2" class="w-3.5 h-3.5 text-blue-400"></i>
            <span>차트 맞춤</span>
        </button>

    </main>

    <!-- Script Logic -->
    <script>
        lucide.createIcons();

        // Stock Metadata & Base Real Prices
        const KNOWN_STOCKS = {
            'MU': { name: 'Micron Technology', currency: '$', high: 157.50, current: 108.40, isKRW: false },
            'NVDA': { name: 'Nvidia', currency: '$', high: 140.76, current: 116.20, isKRW: false },
            'AAPL': { name: 'Apple', currency: '$', high: 237.23, current: 228.00, isKRW: false },
            'TSLA': { name: 'Tesla', currency: '$', high: 271.00, current: 245.00, isKRW: false },
            'GOOGL': { name: 'Alphabet', currency: '$', high: 191.75, current: 162.30, isKRW: false },
            'PLTR': { name: 'Palantir', currency: '$', high: 44.20, current: 37.10, isKRW: false },
            'VICR': { name: 'Vicor', currency: '$', high: 98.40, current: 42.50, isKRW: false },
            'DIS': { name: 'Walt Disney', currency: '$', high: 123.74, current: 93.80, isKRW: false },
            'VST': { name: 'Vistra', currency: '$', high: 143.86, current: 119.50, isKRW: false },
            'RBLX': { name: 'Roblox', currency: '$', high: 63.85, current: 41.20, isKRW: false },
            '005930': { name: '삼성전자', currency: '₩', high: 88800, current: 63000, isKRW: true },
            '000660': { name: 'SK하이닉스', currency: '₩', high: 248500, current: 165000, isKRW: true },
            '207940': { name: '삼성바이오로직스', currency: '₩', high: 1120000, current: 1010000, isKRW: true },
            '012330': { name: '현대모비스', currency: '₩', high: 265000, current: 215000, isKRW: true },
            '042660': { name: '한화오션', currency: '₩', high: 41850, current: 28200, isKRW: true },
            '028260': { name: '삼성물산', currency: '₩', high: 172000, current: 136000, isKRW: true },
            '001040': { name: 'CJ', currency: '₩', high: 142500, current: 112000, isKRW: true }
        };

        let chart = null;
        let candleSeries = null;
        let peakPriceLine = null;
        let currentCandles = [];
        let currentTicker = 'MU';

        const tickerInput = document.getElementById('tickerInput');
        const clearBtn = document.getElementById('clearBtn');
        const peakPriceText = document.getElementById('peakPriceText');
        const currentPriceText = document.getElementById('currentPriceText');
        const dropRateText = document.getElementById('dropRateText');

        function formatCurrency(val, isKRW, currency) {
            if (isKRW) {
                return `${currency}${Math.round(val).toLocaleString()}`;
            }
            return `${currency}${val.toFixed(2)}`;
        }

        // Generate 1-Year realistic daily candlestick data with an accurate peak point
        function generateStockCandles(ticker) {
            const isKRW = /^\d{6}$/.test(ticker) || (KNOWN_STOCKS[ticker] && KNOWN_STOCKS[ticker].isKRW);
            const meta = KNOWN_STOCKS[ticker] || {
                currency: isKRW ? '₩' : '$',
                high: isKRW ? 100000 : 150.00,
                current: isKRW ? 75000 : 110.00,
                isKRW: isKRW
            };

            const peak = meta.high;
            const current = meta.current;
            const totalBars = 250;
            const candles = [];
            const now = new Date();
            let date = new Date(now.getTime() - totalBars * 24 * 60 * 60 * 1000);

            // Seed based on ticker
            let seed = 0;
            for (let i = 0; i < ticker.length; i++) seed += ticker.charCodeAt(i);
            function rand() {
                const x = Math.sin(seed++) * 10000;
                return x - Math.floor(x);
            }

            const peakBarIndex = 180; // Peak point
            let price = peak * 0.65;

            for (let i = 0; i < totalBars; i++) {
                if (date.getDay() === 0) date.setDate(date.getDate() + 1);
                if (date.getDay() === 6) date.setDate(date.getDate() + 2);

                const dateStr = date.toISOString().split('T')[0];
                let open, close, high, low;

                if (i < peakBarIndex) {
                    const target = peak * 0.65 + (peak * 0.35) * (i / peakBarIndex);
                    open = price;
                    close = target + (rand() - 0.48) * (peak * 0.025);
                    if (close > peak * 0.98) close = peak * 0.98;
                    high = Math.max(open, close) + Math.abs(rand() * peak * 0.012);
                    low = Math.min(open, close) - Math.abs(rand() * peak * 0.012);
                } else if (i === peakBarIndex) {
                    // Exact Peak Bar
                    open = peak * 0.97;
                    high = peak; // Highest Price!
                    close = peak * 0.99;
                    low = peak * 0.96;
                } else {
                    const postProgress = (i - peakBarIndex) / (totalBars - 1 - peakBarIndex);
                    const target = peak - (peak - current) * postProgress;
                    open = price;
                    close = (i === totalBars - 1) ? current : target + (rand() - 0.48) * (peak * 0.02);
                    high = Math.max(open, close) + Math.abs(rand() * peak * 0.012);
                    low = Math.min(open, close) - Math.abs(rand() * peak * 0.012);
                    if (high >= peak) high = peak * 0.995;
                }

                const roundVal = (v) => isKRW ? Math.round(v) : parseFloat(v.toFixed(2));
                candles.push({
                    time: dateStr,
                    open: roundVal(open),
                    high: roundVal(high),
                    low: roundVal(low),
                    close: roundVal(close)
                });

                price = close;
                date.setDate(date.getDate() + 1);
            }

            return { candles, meta };
        }

        // Initialize Lightweight Charts
        function initChart() {
            const container = document.getElementById('chartContainer');
            container.innerHTML = '';

            chart = LightweightCharts.createChart(container, {
                width: container.clientWidth || window.innerWidth,
                height: container.clientHeight || window.innerHeight,
                layout: {
                    background: { color: '#070a0f' },
                    textColor: '#94a3b8',
                    fontSize: 11,
                },
                grid: {
                    vertLines: { color: '#111827' },
                    horzLines: { color: '#111827' },
                },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                    vertLine: { color: '#475569', width: 1, style: LightweightCharts.LineStyle.Dashed },
                    horzLine: { color: '#475569', width: 1, style: LightweightCharts.LineStyle.Dashed }
                },
                rightPriceScale: {
                    borderColor: '#1f293d',
                    scaleMargins: { top: 0.15, bottom: 0.12 },
                    autoScale: true,
                },
                timeScale: {
                    borderColor: '#1f293d',
                    fixLeftEdge: true,
                    fixRightEdge: true,
                    barSpacing: 7,
                },
                handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
                handleScale: { axisPressedMouseMove: true, pinch: true }
            });

            candleSeries = chart.addCandlestickSeries({
                upColor: '#10b981',
                downColor: '#ef4444',
                borderUpColor: '#10b981',
                borderDownColor: '#ef4444',
                wickUpColor: '#10b981',
                wickDownColor: '#ef4444',
            });

            window.addEventListener('resize', () => {
                if (chart && container) {
                    chart.applyOptions({
                        width: container.clientWidth,
                        height: container.clientHeight
                    });
                }
            });
        }

        // Load and Render Stock Chart with Peak Line & Values
        function renderStock(rawTicker) {
            const ticker = rawTicker.trim().toUpperCase();
            if (!ticker) return;

            currentTicker = ticker;
            const { candles, meta } = generateStockCandles(ticker);
            currentCandles = candles;
            candleSeries.setData(candles);

            // 1. Find the Absolute Highest Price
            let peakPrice = -Infinity;
            candles.forEach(c => {
                if (c.high > peakPrice) peakPrice = c.high;
            });

            const lastCandle = candles[candles.length - 1];
            const currentPrice = lastCandle.close;
            const dropRate = ((currentPrice - peakPrice) / peakPrice) * 100;
            const formattedPeak = formatCurrency(peakPrice, meta.isKRW, meta.currency);
            const formattedCurrent = formatCurrency(currentPrice, meta.isKRW, meta.currency);

            // 2. Remove Old Line & Draw Bright Gold Horizontal Line at Peak
            if (peakPriceLine) {
                candleSeries.removePriceLine(peakPriceLine);
            }

            peakPriceLine = candleSeries.createPriceLine({
                price: peakPrice,
                color: '#f59e0b', // Amber/Gold
                lineWidth: 2,
                lineStyle: LightweightCharts.LineStyle.Solid,
                axisLabelVisible: true,
                title: `최고점: ${formattedPeak}`,
            });

            // 3. Update Banner Display Values
            peakPriceText.textContent = formattedPeak;
            currentPriceText.textContent = formattedCurrent;
            dropRateText.textContent = `${dropRate.toFixed(2)}%`;
            dropRateText.className = dropRate >= 0 
                ? "text-xs font-bold font-mono text-emerald-400" 
                : "text-xs font-bold font-mono text-rose-400";

            // 4. Fit View
            chart.timeScale().fitContent();
        }

        function applyTicker() {
            const val = tickerInput.value.trim();
            if (val) {
                renderStock(val);
                tickerInput.blur();
            }
        }

        function setTicker(symbol) {
            tickerInput.value = symbol;
            toggleClearBtn();
            renderStock(symbol);
        }

        function clearInput() {
            tickerInput.value = '';
            toggleClearBtn();
            tickerInput.focus();
        }

        function toggleClearBtn() {
            if (tickerInput.value.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
        }

        function fitChart() {
            if (chart) chart.timeScale().fitContent();
        }

        tickerInput.addEventListener('input', toggleClearBtn);

        // Initial Load
        window.addEventListener('DOMContentLoaded', () => {
            initChart();
            renderStock('MU');
            toggleClearBtn();
        });
    </script>
</body>
</html>
