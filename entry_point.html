<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모바일 주식 차트 - Ticker Chart</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- TradingView Widget Script -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            950: '#070a0f',
                            900: '#0d131f',
                            800: '#151d2e',
                            700: '#222f46'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');
        
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #070a0f;
            color: #e2e8f0;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body class="h-[100dvh] flex flex-col bg-[#070a0f] text-slate-100 antialiased overflow-hidden">

    <!-- Top Sticky Search & Ticker Bar -->
    <header class="bg-[#0d131f] border-b border-slate-800 px-3 py-2 shrink-0 z-50">
        <div class="max-w-2xl mx-auto space-y-2">
            
            <!-- Ticker Input Row -->
            <form id="tickerForm" class="flex items-center gap-2" onsubmit="event.preventDefault(); applyTicker();">
                <div class="relative flex-1">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="search" class="w-4 h-4 text-blue-400"></i>
                    </div>
                    <input 
                        id="tickerInput" 
                        type="text" 
                        value="MU" 
                        placeholder="티커 입력 (예: MU, NVDA, AAPL, 005930)" 
                        autocomplete="off"
                        autocapitalize="characters"
                        spellcheck="false"
                        class="w-full h-11 bg-slate-800/90 text-white font-mono font-bold text-sm rounded-xl pl-9 pr-8 border border-slate-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 focus:outline-none transition uppercase"
                    />
                    <button 
                        type="button" 
                        id="clearBtn" 
                        class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-white"
                        onclick="clearInput()"
                    >
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>

                <button 
                    type="submit" 
                    class="h-11 px-4 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-bold text-sm rounded-xl flex items-center justify-center gap-1.5 shadow-lg shadow-blue-600/25 transition shrink-0"
                >
                    <span>조회</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>

            <!-- Quick Ticker Quick-Select Chips -->
            <div class="flex items-center gap-1.5 overflow-x-auto pb-0.5 text-xs no-scrollbar">
                <span class="text-[10px] text-slate-400 font-semibold shrink-0 mr-0.5">인기:</span>
                <button onclick="setTicker('MU')" class="px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-emerald-400 border border-slate-700 font-mono font-bold shrink-0 transition">MU</button>
                <button onclick="setTicker('NVDA')" class="px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700 font-mono font-semibold shrink-0 transition">NVDA</button>
                <button onclick="setTicker('TSLA')" class="px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700 font-mono font-semibold shrink-0 transition">TSLA</button>
                <button onclick="setTicker('AAPL')" class="px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700 font-mono font-semibold shrink-0 transition">AAPL</button>
                <button onclick="setTicker('PLTR')" class="px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700 font-mono font-semibold shrink-0 transition">PLTR</button>
                <button onclick="setTicker('QQQ')" class="px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-blue-400 border border-slate-700 font-mono font-semibold shrink-0 transition">QQQ</button>
                <button onclick="setTicker('KRX:005930')" class="px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-amber-400 border border-slate-700 font-mono font-semibold shrink-0 transition">삼성전자</button>
                <button onclick="setTicker('KRX:000660')" class="px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-amber-400 border border-slate-700 font-mono font-semibold shrink-0 transition">SK하이닉스</button>
                <button onclick="setTicker('BINANCE:BTCUSDT')" class="px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-yellow-400 border border-slate-700 font-mono font-semibold shrink-0 transition">BTC</button>
            </div>

        </div>
    </header>

    <!-- Main Fullscreen Chart Area -->
    <main class="flex-1 w-full relative bg-[#070a0f]">
        <div id="tradingview_chart_container" class="w-full h-full"></div>
    </main>

    <!-- Script Logic -->
    <script>
        lucide.createIcons();

        let currentSymbol = 'MU';
        const tickerInput = document.getElementById('tickerInput');
        const clearBtn = document.getElementById('clearBtn');

        // Format symbol for Korean / Crypto / US stocks
        function normalizeSymbol(symbol) {
            symbol = symbol.trim().toUpperCase();
            if (!symbol) return 'MU';

            // 한국 주식 6자리 숫자 코드 (예: 005930 -> KRX:005930)
            if (/^\d{6}$/.test(symbol)) {
                return `KRX:${symbol}`;
            }
            return symbol;
        }

        // Render TradingView Real-Time Mobile Chart
        function loadChart(symbol) {
            const normalized = normalizeSymbol(symbol);
            currentSymbol = normalized;

            const container = document.getElementById('tradingview_chart_container');
            container.innerHTML = '';

            const widgetDiv = document.createElement('div');
            widgetDiv.id = 'tv_widget_elem';
            widgetDiv.className = 'w-full h-full';
            container.appendChild(widgetDiv);

            if (typeof TradingView !== 'undefined') {
                new TradingView.widget({
                    "autosize": true,
                    "symbol": normalized,
                    "interval": "D",
                    "timezone": "Asia/Seoul",
                    "theme": "dark",
                    "style": "1",
                    "locale": "kr",
                    "toolbar_bg": "#0d131f",
                    "enable_publishing": false,
                    "hide_top_toolbar": false,
                    "save_image": false,
                    "container_id": "tv_widget_elem",
                    "studies": [
                        "MASimple@tv-basicstudies",
                        "Volume@tv-basicstudies"
                    ],
                    "disabled_features": [
                        "header_screenshot",
                        "header_saveload"
                    ]
                });
            }
        }

        function applyTicker() {
            const val = tickerInput.value.trim();
            if (val) {
                loadChart(val);
                tickerInput.blur(); // 모바일 가상 키보드 닫기
            }
        }

        function setTicker(symbol) {
            tickerInput.value = symbol.replace('KRX:', '');
            toggleClearBtn();
            loadChart(symbol);
        }

        function clearInput() {
            tickerInput.value = '';
            toggleClearBtn();
            tickerInput.focus();
        }

        function toggleClearBtn() {
            if (tickerInput.value.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
        }

        tickerInput.addEventListener('input', toggleClearBtn);

        // Initial Load
        window.addEventListener('DOMContentLoaded', () => {
            loadChart('MU');
            toggleClearBtn();
        });
    </script>
</body>
</html>
